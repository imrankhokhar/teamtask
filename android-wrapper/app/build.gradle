plugins {
    id 'com.android.application'
}

android {
    namespace 'com.teamtask.web'
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId 'com.teamtask.web'
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName '1.5.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
