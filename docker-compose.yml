services:
  teamtask:
    build: .
    image: teamtask:latest
    container_name: teamtask
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "4000"
      TEAMTASK_DATA_DIR: /app/data
      TEAMTASK_UPLOADS_DIR: /app/data/uploads
      TEAMTASK_WEB_DIST: /app/web
    volumes:
      # Uploads and files survive container rebuilds
      - teamtask-data:/app/data

volumes:
  teamtask-data:
